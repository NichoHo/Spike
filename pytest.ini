[pytest]
testpaths = tests
# sys-level capture, not fd-level: fd capture swaps and closes the process's stdout/stderr handles between tests. On
# Windows the next SQLite connection can reuse a freed handle number, and MediaPipe's native (C++) log lines from a
# face-track render were then written into the test database and corrupted it (Nov 7, 2026).
addopts = --capture=sys
